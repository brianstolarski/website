<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Merry Christmas!</title>
    <link href="https://fonts.googleapis.com/css2?family=Comic+Neue:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f8ff;
            font-family: 'Comic Neue', cursive;
            text-align: center;
            overflow: hidden;
        }

        h1 {
            color: #c62828;
            margin-bottom: 40px;
            font-size: 3.5em;
            font-family: 'Comic Neue', cursive;
            font-weight: bold;
            text-shadow: 2px 2px 0px #fff;
        }

        .buttons-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 400px;
            height: 150px;
            position: relative;
        }

        .button {
            padding: 15px 30px;
            font-size: 1.2em;
            cursor: pointer;
            border: none;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
            font-weight: bold;
        }

        #yes-btn {
            background-color: #2e7d32;
            color: white;
            z-index: 10;
        }

        #yes-btn:hover {
            background-color: #1b5e20;
            transform: scale(1.05);
        }

        #no-btn {
            background-color: #c62828;
            color: white;
            position: absolute;
            transition: 0.0s ease;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
        }

        .message-container {
            margin-top: 50px;
            font-size: 1.8em;
            color: #2e7d32;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.1);
        }

        .food-container {
            display: none;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-top: 20px;
            max-width: 600px;
        }
        
        .food-btn {
            background-color: #ff9800;
            color: white;
            padding: 10px 20px;
            font-size: 1em;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            font-weight: bold;
        }
        
        .food-btn:hover {
            transform: scale(1.05);
            background-color: #f57c00;
        }
    </style>
</head>
<body>

    <h1>wanna hang out sometime O_O</h1>
    <div class="buttons-container">
        <button id="yes-btn" class="button" onclick="handleYes()">ya :3</button>

        <button id="no-btn" class="button">no (im mean)</button>
    </div>

    <div id="message" class="message-container"></div>

    <div id="food-options" class="food-container">
        <button class="food-btn" onclick="selectFood('wingstop')">wingstop</button>
        <button class="food-btn" onclick="selectFood('sushi')">sushi</button>
        <button class="food-btn" onclick="selectFood('the triple dipper')">triple Dipper</button>
        <button class="food-btn" onclick="selectFood('the mystery surprise')">mystery Surprise</button>
    </div>

    <button id="restart-btn" class="button" onclick="restart()" style="display: none; margin-top: 20px; background-color: #2196F3; color: white;">i change my mind</button>

    <div style="position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 100;">
        <a href="https://open.spotify.com/playlist/4PxtLxrZHeyqTkwEujiwj3?si=494dc897c3c6451a&pt=8f6f82c4aff26bfbf4863ecc34a33824" 
           target="_blank" 
           style="display: inline-block; padding: 10px 20px; background-color: #1DB954; color: white; text-decoration: none; font-weight: bold; border-radius: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.2); font-family: 'Comic Neue', cursive;">
            listen to this
        </a>
    </div>

<script>
    const noBtn = document.getElementById('no-btn');
    const yesBtn = document.getElementById('yes-btn');
    const messageDiv = document.getElementById('message');
    const foodOptions = document.getElementById('food-options');
    const restartBtn = document.getElementById('restart-btn');

    function handleYes() {
        messageDiv.textContent = "Oh baby, I knew you'd say yes!";
        
        const img = document.createElement('img');
        img.src = 'cat-jump.gif';
        img.style.display = 'block';
        img.style.margin = '20px auto';
        messageDiv.appendChild(img);

        noBtn.style.display = 'none'; 
        yesBtn.style.pointerEvents = 'none';
        
        foodOptions.style.display = 'flex';

        const audio = new Audio('yipee.mp3');
        audio.play();
    }

    function selectFood(food) {
        messageDiv.textContent = "oh baby, we're getting " + food + "!!!!!!!! " + "send me a screenshot of your choice!!!!";
        foodOptions.style.display = 'none';
        
        const img = document.createElement('img');
        img.src = 'cat-jump.gif';
        img.style.display = 'block';
        img.style.margin = '20px auto';
        messageDiv.appendChild(img);

        restartBtn.style.display = 'block';
    }

    function restart() {
        messageDiv.textContent = '';
        noBtn.style.display = 'block';
        yesBtn.style.pointerEvents = 'auto';
        foodOptions.style.display = 'none';
        restartBtn.style.display = 'none';
        
        noBtn.style.position = 'absolute';
        noBtn.style.right = '10px';
        noBtn.style.top = '50%';
        noBtn.style.left = 'auto';
        noBtn.style.transform = 'translateY(-50%)';
    }

    function moveButton(e) {
        if (e && (e.type === 'touchstart' || e.type === 'click')) {
            e.preventDefault();
        }

        const maxWidth = window.innerWidth - noBtn.offsetWidth;
        const maxHeight = window.innerHeight - noBtn.offsetHeight;

        const randomX = Math.random() * maxWidth;
        const randomY = Math.random() * maxHeight;

        noBtn.style.position = 'fixed';
        noBtn.style.left = randomX + 'px';
        noBtn.style.top = randomY + 'px';
        
        noBtn.style.transform = 'none';
    }

    noBtn.addEventListener('mouseover', moveButton);
    noBtn.addEventListener('touchstart', moveButton, { passive: false });
    noBtn.addEventListener('click', moveButton);
    noBtn.addEventListener('mousedown', moveButton);
    noBtn.addEventListener('focus', moveButton);
    noBtn.addEventListener('click', moveButton);

    window.onload = () => {
        yesBtn.style.position = 'absolute';
        yesBtn.style.left = '10px';
        yesBtn.style.top = '50%';
        yesBtn.style.transform = 'translateY(-50%)';

        noBtn.style.position = 'absolute';
        noBtn.style.right = '10px';
        noBtn.style.top = '50%';
        noBtn.style.left = 'auto';
        noBtn.style.transform = 'translateY(-50%)';
    };

</script>
</body>
</html>
